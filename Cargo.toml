[workspace]
resolver = "2"
members = [
  "crates/srv-common",
  "bins/srv-input",
  "bins/srv-output",
  "bins/srv-control-ingest",
  "bins/srv-writeback",
  "bins/srv-export",
  "bins/srv-plan-select",
  "bins/vault-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.13"
toml = "0.8"
